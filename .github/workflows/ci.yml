on:
  push:
  pull_request:

env:
  NODE_VERSION: "20"
  DATABASE_URL: "file:./ci.db"
  BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
  BETTER_AUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

name: CI

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get branch name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      - name: Check conditions
        run: |
          if [[ "$BRANCH_NAME" =~ ^ga-ignore- ]]; then
            echo "Branch starts with 'ga-ignore-', skipping workflow."
            exit 78
          fi
          echo "Branch is valid, continuing workflow."

  check_program_compilation:
    name: Compil
    runs-on: ubuntu-latest
    needs: [check-branch]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Apply database migrations
        run: npm run db:migrate
      # Le seed genere une video de demonstration par profil via ffmpeg
      # (drawtext). Sans l'outil, l'echec est avale silencieusement et se
      # manifeste seulement plus tard, a l'etape "Verify demo data in bundle".
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Seed demonstration data
        run: npm run db:seed
      - name: Build
        timeout-minutes: 5
        run: npm run build
      - name: Check build output
        run: |
          if [ ! -d .next/standalone ]; then
            echo "::error::Build output .next/standalone not found"
            exit 1
          fi
          echo "Build output found"
      # SQLite est en mode WAL : tant que le journal n'est pas replie dans le
      # fichier principal, `cp ci.db` copie une base vide. Le build rouvre la
      # base (hook d'instrumentation) et recree un WAL, donc le repli doit se
      # faire ICI, juste avant la copie — pas avant le build.
      - name: Checkpoint database
        run: node -e "const D=require('better-sqlite3');const d=new D('ci.db');d.pragma('wal_checkpoint(TRUNCATE)');d.close()"
      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r drizzle .next/standalone/drizzle
          cp ci.db .next/standalone/ci.db
          # Les videos de demonstration sont servies depuis le disque : sans ce
          # dossier, les fiches publiques s'ouvrent sans lecteur.
          cp -r uploads .next/standalone/uploads
      # Garde-fou : un artefact qui s'ouvre sur une base vide donne une
      # demonstration ou aucune connexion ne marche. On le detecte ici, pas
      # devant la camera.
      - name: Verify demo data in bundle
        run: |
          node -e "
          const D = require('better-sqlite3');
          const d = new D('.next/standalone/ci.db', { readonly: true });
          const users = d.prepare('select count(*) c from user').get().c;
          const profiles = d.prepare(\"select count(*) c from profile where status='published'\").get().c;
          const contacts = d.prepare('select count(*) c from contact').get().c;
          console.log({ users, profiles, contacts });
          if (users < 3 || profiles < 5 || contacts < 1) {
            console.error('::error::Base de demonstration vide ou incomplete dans l artefact');
            process.exit(1);
          }
          "
          videos=$(ls .next/standalone/uploads/*.mp4 2>/dev/null | wc -l)
          echo "videos: $videos"
          if [ "$videos" -lt 5 ]; then
            echo "::error::Videos de demonstration manquantes dans l artefact"
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: profilsactifs-build
          path: .next/standalone
          if-no-files-found: error

  run_tests:
    name: Run test
    runs-on: ubuntu-latest
    needs: [check_program_compilation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run unit tests
        timeout-minutes: 5
        run: npm test
