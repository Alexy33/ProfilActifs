on:
  push:
  pull_request:

env:
  NODE_VERSION: "20"
  DATABASE_URL: "file:./ci.db"
  BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
  BETTER_AUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

name: CI

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get branch name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      - name: Check conditions
        run: |
          if [[ "$BRANCH_NAME" =~ ^ga-ignore- ]]; then
            echo "Branch starts with 'ga-ignore-', skipping workflow."
            exit 78
          fi
          echo "Branch is valid, continuing workflow."

  check_program_compilation:
    name: Compil
    runs-on: ubuntu-latest
    needs: [check-branch]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Seed demonstration data
        run: npm run db:seed
      - name: Checkpoint database
        run: node -e "const D=require('better-sqlite3');const d=new D('ci.db');d.pragma('wal_checkpoint(TRUNCATE)');d.close()"
      - name: Build
        timeout-minutes: 5
        run: npm run build
      - name: Check build output
        run: |
          if [ ! -d .next/standalone ]; then
            echo "::error::Build output .next/standalone not found"
            exit 1
          fi
          echo "Build output found"
      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r drizzle .next/standalone/drizzle
          cp ci.db .next/standalone/ci.db
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: profilsactifs-build
          path: .next/standalone
          if-no-files-found: error

  run_tests:
    name: Run test
    runs-on: ubuntu-latest
    needs: [check_program_compilation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run unit tests
        timeout-minutes: 5
        run: npm test
